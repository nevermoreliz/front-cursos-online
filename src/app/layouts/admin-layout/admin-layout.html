<!-- ===== Page Wrapper Start ===== -->
<div class="flex h-screen overflow-hidden bg-gray-50 text-gray-800 dark:bg-gray-950 dark:text-gray-100 selection:bg-indigo-500/30 font-sans">
  
  <!-- ===== Sidebar Start ===== -->
  <app-sidebar 
    class="block h-screen lg:shrink-0 transition-all duration-300 relative z-30"
    [ngClass]="layoutService.isCollapsed() ? 'w-0 lg:w-20' : 'w-0 lg:w-72'"
  ></app-sidebar>
  <!-- ===== Sidebar End ===== -->

  <!-- ===== Content Area Start ===== -->
  <div class="relative flex flex-1 flex-col overflow-hidden bg-gray-50/50 dark:bg-gray-900/50 min-w-0">
    
    <!-- ===== Header Start ===== -->
    <app-header></app-header>
    <!-- ===== Header End ===== -->

    <!-- ===== Main Content Start ===== -->
    <main class="relative flex-1 overflow-y-auto overflow-x-hidden">
      <!-- Overlay de carga con Angular Material Spinner -->
      @if (loadingService.isLoading()) {
      <div
        class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-white/70 backdrop-blur-sm dark:bg-gray-950/70 transition-all duration-200">
        <mat-spinner diameter="44" strokeWidth="4"></mat-spinner>
        <span class="mt-3 text-xs font-semibold tracking-wider text-gray-500 uppercase dark:text-gray-400">
          Cargando contenido...
        </span>
      </div>
      }

      <div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10 min-h-full relative">
        
        <!-- Decoration background glow (optional modern touch) -->
        <div class="absolute inset-0 -z-10 overflow-hidden pointer-events-none">
          <div class="absolute -top-40 right-0 w-96 h-96 rounded-full bg-indigo-500/10 blur-3xl opacity-50 dark:opacity-20 mix-blend-multiply dark:mix-blend-lighten"></div>
          <div class="absolute top-40 left-10 w-72 h-72 rounded-full bg-purple-500/10 blur-3xl opacity-50 dark:opacity-20 mix-blend-multiply dark:mix-blend-lighten"></div>
        </div>

        <!-- Inner Content (Router Outlet) -->
        <div class="relative z-0 h-full w-full rounded-2xl">
          <router-outlet></router-outlet>
        </div>
      </div>
    </main>
    <!-- ===== Main Content End ===== -->

    <!-- Alertas globales (Toast) -->
    <app-alert />

    <!-- Modal de confirmación global exclusivo para el Admin Layout -->
    <app-confirm-dialog />
  </div>
  <!-- ===== Content Area End ===== -->
</div>
<!-- ===== Page Wrapper End ===== -->
