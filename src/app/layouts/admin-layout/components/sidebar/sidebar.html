<!-- Sidebar Backdrop (Mobile) -->
<div *ngIf="layoutService.isSidebarOpen()" (click)="layoutService.toggleSidebar()"
  class="fixed inset-0 z-40 bg-gray-900/50 backdrop-blur-sm lg:hidden transition-opacity"></div>

<!-- Sidebar -->
<aside
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  class="fixed inset-y-0 left-0 z-50 flex flex-col bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 transition-all duration-300 ease-in-out h-screen"
  [ngClass]="{
    'translate-x-0': layoutService.isSidebarOpen(),
    '-translate-x-full lg:translate-x-0': !layoutService.isSidebarOpen(),
    'w-72 lg:relative lg:shadow-none': !layoutService.isCollapsed(),
    'lg:absolute lg:top-0 lg:left-0': layoutService.isCollapsed(),
    'w-72 lg:w-20 lg:shadow-none': layoutService.isCollapsed() && !isHovered(),
    'w-72 lg:w-72 shadow-2xl dark:shadow-indigo-950/60 lg:z-50': layoutService.isCollapsed() && isHovered()
  }">

  <!-- ═══════════════ Sidebar Header ═══════════════ -->
  <div class="flex h-16 shrink-0 items-center px-6 border-b border-gray-100 dark:border-gray-800"
    [ngClass]="isVisualmenteColapsado() ? 'lg:justify-center lg:px-0' : 'justify-between'">
    <a routerLink="/" class="flex items-center gap-3 overflow-hidden"
      [ngClass]="isVisualmenteColapsado() ? 'lg:justify-center' : ''">
      <div
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 shadow-lg shadow-indigo-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
      </div>
      <span
        class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600 dark:from-indigo-400 dark:to-purple-400 whitespace-nowrap transition-opacity duration-200"
        [ngClass]="isVisualmenteColapsado() ? 'lg:hidden' : ''">
        EduDash
      </span>
    </a>

    <!-- Collapse / Pin button in sidebar header (Desktop) -->
    <button (click)="layoutService.toggleCollapsed()"
      class="hidden lg:flex h-8 w-8 items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-200 transition-colors"
      [title]="layoutService.isCollapsed() ? 'Fijar menú' : 'Colapsar menú'"
      [ngClass]="isVisualmenteColapsado() ? 'lg:hidden' : ''">
      <svg class="h-5 w-5 transition-transform duration-200" [ngClass]="layoutService.isCollapsed() ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
      </svg>
    </button>

    <!-- Close button for mobile -->
    <button (click)="layoutService.toggleSidebar()"
      class="lg:hidden text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- ═══════════════ Sidebar Content ═══════════════ -->
  <div class="flex-1 overflow-y-auto py-6 no-scrollbar pb-24">
    <nav class="space-y-1" [ngClass]="isVisualmenteColapsado() ? 'lg:px-2 px-4' : 'px-4'">

      <ng-container *ngFor="let item of menuItems(); trackBy: trackByTitle">

        <!-- ─── HEADING (Título de sección) ─── -->
        <ng-container *ngIf="item.heading">
          <h3 class="mt-6 mb-2 ml-4 text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500 whitespace-nowrap"
            [ngClass]="isVisualmenteColapsado() ? 'lg:hidden' : ''">
            {{ item.title }}
          </h3>
          <!-- Separador sutil cuando está colapsado -->
          <div *ngIf="isVisualmenteColapsado()" class="hidden lg:block my-3 mx-2 border-t border-gray-100 dark:border-gray-800"></div>
        </ng-container>

        <!-- ─── LINK (Navegación directa, sin submenú) ─── -->
        <ng-container *ngIf="!item.heading && !item.submenu">
          <a [routerLink]="item.route"
            routerLinkActive="bg-indigo-50/80 text-indigo-700 dark:bg-indigo-500/10 dark:text-indigo-300 font-semibold before:absolute before:inset-y-0 before:left-0 before:w-1 before:rounded-r-full before:bg-indigo-600 dark:before:bg-indigo-400"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' || item.route === '/admin/home' }"
            class="relative flex items-center gap-3 rounded-lg px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-800/50 dark:hover:text-white transition-all group overflow-hidden"
            [ngClass]="isVisualmenteColapsado() ? 'lg:justify-center lg:px-0 lg:py-3' : ''"
            [title]="isVisualmenteColapsado() ? item.title : (item.tooltip || '')">

            <!-- Icono -->
            <ng-container *ngTemplateOutlet="iconoTemplate; context: { $implicit: item }"></ng-container>

            <!-- Título -->
            <span class="truncate whitespace-nowrap" [ngClass]="isVisualmenteColapsado() ? 'lg:hidden' : ''">
              {{ item.title }}
            </span>

            <!-- Badge -->
            <span *ngIf="item.badge"
              class="ml-auto inline-flex items-center rounded-full bg-indigo-100 dark:bg-indigo-900/50 px-2 py-0.5 text-xs font-medium text-indigo-700 dark:text-indigo-300"
              [ngClass]="isVisualmenteColapsado() ? 'lg:hidden' : ''">
              {{ item.badge }}
            </span>
          </a>
        </ng-container>

        <!-- ─── PARENT (Con submenú desplegable) ─── -->
        <ng-container *ngIf="!item.heading && item.submenu">
          <div>
            <!-- Botón para expandir/colapsar -->
            <button (click)="toggleSubmenu(item)"
              class="relative flex w-full items-center gap-3 rounded-lg px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-800/50 dark:hover:text-white transition-all group overflow-hidden"
              [ngClass]="{
                'lg:justify-center lg:px-0 lg:py-3': isVisualmenteColapsado(),
                'bg-indigo-50/50 text-indigo-700 dark:bg-indigo-500/5 dark:text-indigo-300': item.active
              }"
              [title]="isVisualmenteColapsado() ? item.title : (item.tooltip || '')">

              <!-- Icono -->
              <ng-container *ngTemplateOutlet="iconoTemplate; context: { $implicit: item }"></ng-container>

              <!-- Título -->
              <span class="truncate whitespace-nowrap" [ngClass]="isVisualmenteColapsado() ? 'lg:hidden' : ''">
                {{ item.title }}
              </span>

              <!-- Flecha de expansión -->
              <svg
                class="ml-auto h-4 w-4 shrink-0 text-gray-400 transition-transform duration-200"
                [ngClass]="{
                  'lg:hidden': isVisualmenteColapsado(),
                  'rotate-180': item.expanded
                }"
                fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <!-- Submenú (con animación de altura) -->
            <div *ngIf="item.expanded && !isVisualmenteColapsado()"
              class="mt-1 ml-4 space-y-1 border-l-2 border-gray-100 dark:border-gray-800 pl-4">

              <ng-container *ngFor="let subItem of item.submenu; trackBy: trackByTitle">

                <!-- Sub-ítem con ruta directa -->
                <a *ngIf="subItem.route && !subItem.submenu"
                  [routerLink]="subItem.route"
                  routerLinkActive="text-indigo-700 dark:text-indigo-300 font-semibold bg-indigo-50/60 dark:bg-indigo-500/10"
                  class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-gray-500 hover:text-gray-900 hover:bg-gray-50 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-800/50 transition-all">

                  <!-- Icono del subítem (si tiene) -->
                  <ng-container *ngIf="subItem.svgIcon">
                    <ng-container *ngTemplateOutlet="iconoTemplate; context: { $implicit: subItem }"></ng-container>
                  </ng-container>

                  <!-- Punto indicador (si no tiene icono) -->
                  <span *ngIf="!subItem.svgIcon"
                    class="h-1.5 w-1.5 shrink-0 rounded-full bg-gray-300 dark:bg-gray-600 group-hover:bg-indigo-500">
                  </span>

                  <span class="truncate whitespace-nowrap">{{ subItem.title }}</span>
                </a>

                <!-- Sub-heading (título dentro del submenú) -->
                <span *ngIf="!subItem.route && !subItem.submenu"
                  class="block px-3 py-2 text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500 whitespace-nowrap">
                  {{ subItem.title }}
                </span>

                <!-- Sub-submenú (tercer nivel) -->
                <ng-container *ngIf="subItem.submenu">
                  <button (click)="toggleSubmenu(subItem)"
                    class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm text-gray-500 hover:text-gray-900 hover:bg-gray-50 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-800/50 transition-all">
                    <span class="truncate whitespace-nowrap">{{ subItem.title }}</span>
                    <svg class="ml-auto h-3 w-3 shrink-0 text-gray-400 transition-transform duration-200"
                      [ngClass]="{ 'rotate-180': subItem.expanded }"
                      fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                    </svg>
                  </button>
                  <div *ngIf="subItem.expanded"
                    class="mt-1 ml-3 space-y-1 border-l-2 border-gray-100 dark:border-gray-800 pl-3">
                    <a *ngFor="let nestedItem of subItem.submenu; trackBy: trackByTitle"
                      [routerLink]="nestedItem.route"
                      routerLinkActive="text-indigo-700 dark:text-indigo-300 font-semibold"
                      class="flex items-center gap-2 rounded-lg px-3 py-1.5 text-xs text-gray-500 hover:text-gray-900 hover:bg-gray-50 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-800/50 transition-all">
                      <span class="h-1 w-1 shrink-0 rounded-full bg-gray-300 dark:bg-gray-600"></span>
                      <span class="truncate whitespace-nowrap">{{ nestedItem.title }}</span>
                    </a>
                  </div>
                </ng-container>
              </ng-container>
            </div>
          </div>
        </ng-container>

      </ng-container>
    </nav>
  </div>

  <!-- ═══════════════ User Quick Info at Bottom ═══════════════ -->
  <div
    class="absolute bottom-0 left-0 w-full shrink-0 border-t border-gray-100 bg-white dark:border-gray-800 dark:bg-gray-900 z-10"
    [ngClass]="isVisualmenteColapsado() ? 'lg:p-2' : 'p-4'">
    <div class="flex items-center gap-3 rounded-xl bg-gray-50 dark:bg-gray-800"
      [ngClass]="isVisualmenteColapsado() ? 'lg:justify-center lg:p-2 p-3' : 'p-3'">
      <div class="relative h-10 w-10 shrink-0 rounded-full border-2 border-indigo-100 dark:border-indigo-900">
        <img src="https://ui-avatars.com/api/?name=Admin+User&background=6366f1&color=fff" alt="User"
          class="rounded-full" />
        <span
          class="absolute bottom-0 right-0 h-3 w-3 rounded-full bg-green-500 border-2 border-white dark:border-gray-800"></span>
      </div>
      <div class="flex-1 min-w-0" [ngClass]="isVisualmenteColapsado() ? 'lg:hidden' : ''">
        <p class="truncate text-sm font-semibold text-gray-900 dark:text-white">{{currentUser()?.nombre_completo |
          titlecase}}</p>
        <p class="truncate text-xs text-gray-500 dark:text-gray-400">{{currentUser()?.email}}</p>
      </div>
    </div>
  </div>
</aside>


<!-- ═══════════════════════════════════════════════════════════
     TEMPLATE REUTILIZABLE: Icono SVG
     ─────────────────────────────────
     Detecta automáticamente si el icono es:
       • Un path simple → usa <svg><path [attr.d]>
       • Un SVG completo → usa [innerHTML] con el SVG sanitizado
     ═══════════════════════════════════════════════════════════ -->
<ng-template #iconoTemplate let-item>
  <div
    class="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg transition-colors group-hover:text-indigo-600 dark:group-hover:text-indigo-400">

    <!-- Path simple -->
    <svg *ngIf="esPathSimple(item.svgIcon)"
      class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
      <path [attr.d]="item.svgIcon"></path>
    </svg>

    <!-- SVG completo (sanitizado) -->
    <span *ngIf="item.svgSanitizado"
      class="flex items-center justify-center h-5 w-5 [&>svg]:h-full [&>svg]:w-full"
      [innerHTML]="item.svgSanitizado">
    </span>
  </div>
</ng-template>
