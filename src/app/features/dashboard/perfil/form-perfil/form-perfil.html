<dialog appModal="formPerfil"
    class="fixed inset-0 z-[99999] m-0 flex h-full w-full items-center justify-center overflow-y-auto bg-gray-400/50 backdrop-blur-[32px] p-4 sm:p-5 invisible opacity-0 transition-all open:visible open:opacity-100 dark:bg-gray-900/50">

    <div
        class="no-scrollbar relative w-full max-w-2xl max-h-[calc(100vh-2rem)] overflow-y-auto rounded-3xl bg-white p-5 lg:p-11 dark:bg-gray-900 shadow-2xl">
        <!-- Botón de Cerrar (Equis superior) -->
        <button type="button" (click)="cerrar()"
            class="absolute top-4 right-4 sm:top-5 sm:right-5 z-50 flex h-10 w-10 sm:h-11 sm:w-11 items-center justify-center rounded-full bg-gray-100 text-gray-400 transition-colors hover:bg-gray-200 hover:text-gray-600 dark:bg-white/5 dark:text-gray-400 dark:hover:bg-white/[0.07] dark:hover:text-gray-300">
            <svg class="fill-current" width="24" height="24" viewBox="0 0 24 24" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M6.04289 16.5418C5.65237 16.9323 5.65237 17.5655 6.04289 17.956C6.43342 18.3465 7.06658 18.3465 7.45711 17.956L11.9987 13.4144L16.5408 17.9565C16.9313 18.347 17.5645 18.347 17.955 17.9565C18.3455 17.566 18.3455 16.9328 17.955 16.5423L13.4129 12.0002L17.955 7.45808C18.3455 7.06756 18.3455 6.43439 17.955 6.04387C17.5645 5.65335 16.9313 5.65335 16.5408 6.04387L11.9987 10.586L7.45711 6.04439C7.06658 5.65386 6.43342 5.65386 6.04289 6.04439C5.65237 6.43491 5.65237 7.06808 6.04289 7.4586L10.5845 12.0002L6.04289 16.5418Z"
                    fill="" />
            </svg>
        </button>

        <div class="px-1 sm:px-2 pr-12 sm:pr-14">
            <h4 class="mb-2 text-xl sm:text-2xl font-semibold text-gray-800 dark:text-white/90">
                Editar Información
            </h4>
            <p class="mb-6 text-sm text-gray-500 lg:mb-7 dark:text-gray-400">
                Actualiza tus datos para mantener tu perfil al día.
            </p>
        </div>

        <form class="flex flex-col" [formGroup]="form" (ngSubmit)="guardarCambios()">
            <div class="custom-scrollbar overflow-y-auto px-1 sm:px-2">
                <div class="mb-2">
                    <h4 class="mb-4 sm:mb-5 text-lg font-medium text-gray-800 lg:mb-6 dark:text-white/90">
                        Información Personal
                    </h4>

                    <div class="grid grid-cols-1 gap-x-6 gap-y-4 sm:gap-y-5 lg:grid-cols-2">
                        <!-- Campo Nombre Completo -->
                        <div class="col-span-2 lg:col-span-1">
                            <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
                                Nombre Completo
                            </label>
                            <input type="text" id="nombre_completo" name="nombre_completo"
                                formControlName="nombre_completo" placeholder="Tu nombre"
                                class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder-gray-400 outline-none transition-shadow focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder-white/30 dark:focus:border-indigo-500" />
                        </div>

                        <!-- Campo Correo Electrónico -->
                        <div class="col-span-2 lg:col-span-1">
                            <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
                                Correo Electrónico
                            </label>
                            <input type="email" id="email" name="email" formControlName="email" placeholder="ejemplo@correo.com"
                                class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder-gray-400 outline-none transition-shadow focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder-white/30 dark:focus:border-indigo-500" />
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="mt-6 flex flex-col-reverse sm:flex-row items-center gap-3 px-1 sm:px-2 lg:justify-end">
                <button type="button" (click)="cerrar()" [disabled]="isSaving()"
                    class="flex w-full justify-center rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed sm:w-auto dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/5 transition-colors">
                    Cerrar
                </button>
                <button type="submit" [disabled]="isSaving()"
                    class="flex w-full items-center justify-center gap-2 rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-70 disabled:cursor-not-allowed sm:w-auto transition-all shadow-sm">
                    @if (isSaving()) {
                    <mat-spinner diameter="18" strokeWidth="2.5" class="btn-spinner [&_circle]:!stroke-white"></mat-spinner>
                    <span>Guardando...</span>
                    } @else {
                    <span>Guardar Cambios</span>
                    }
                </button>
            </div>
        </form>
    </div>
</dialog>
